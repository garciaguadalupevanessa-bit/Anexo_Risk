<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de necesidades — Nexo</title>

    <!-- CSS Globales -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />


    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="../css/necesidades.css" />
  </head>
  <body>
    <!-- Header — Anexo Finder, coherente con el resto de la app -->
    <header class="nexo-header" style="background: linear-gradient(135deg, var(--nexo-navy,#0F2038) 0%, var(--nexo-dark,#16181D) 100%); border-bottom: 2px solid var(--nexo-teal,#17A2A0);">
      <a href="../index.html" class="nexo-header__brand" style="color: var(--nexo-white);">
        <img src="../assets/logo/nexo-icon.png" alt="Anexo Finder" style="filter: drop-shadow(0 1px 4px rgba(23,162,160,0.4));" />
        Anexo Finder
      </a>
      <nav class="nexo-nav">
        <a href="mapa.html" class="active" style="color: var(--nexo-teal); border-bottom: 2px solid var(--nexo-teal);">Mapa</a>
        <a href="alertas.html">Alertas</a>
        <a href="../pages/donaciones.html">Ayudas</a>
        <span id="intensityBadge" class="nexo-badge" style="margin-left:10px;background: linear-gradient(135deg, var(--nexo-teal,#17A2A0), var(--nexo-orange,#F2542D)); color: white; border: none; padding: 4px 10px; border-radius: 20px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">0 total</span>
      </nav>
    </header>

  <!-- Estructura Principal de 2 Columnas -->
  <main class="contenedor-mapa-panel">
    
    <!-- PANEL LATERAL (IZQUIERDA) -->
    <aside class="panel-lateral">
      <!-- Lista de Necesidades Activas con Filtro -->
      <section class="seccion-lista">
        <h2>Necesidades Activas</h2>
        
        <!-- Filtro por tipo -->
        <div class="controles" style="margin-bottom: 12px;">
          <label for="typeFilter"><strong>Filtrar:</strong></label>
          <select id="typeFilter">
            <option value="all">Todos los tipos</option>
            <option value="agua">💧 Agua</option>
            <option value="alimentos">🍞 Alimentos</option>
            <option value="parafarmacia">💊 Parafarmacia</option>
            <option value="ropa">👕 Ropa</option>
            <option value="higiene">🧴 Higiene</option>
            <option value="refugio">🏠 Refugio</option>
            <option value="transporte">🚗 Transporte</option>
            <option value="otros">📦 Otros</option>
          </select>
        </div>

        <div id="contenedor-tarjetas">
          <!-- JS inyectará las tarjetas aquí -->
        </div>
      </section>
      
      <!-- Formulario para agregar necesidades -->
      <section class="seccion-form">
        <h2>Reportar Necesidad</h2>

        <form id="form-nueva-necesidad">
            <input
              type="text"
              id="input-titulo"
              placeholder="Título (ej. Agua potable)"
              required
            />          

            <select id="select-tipo" name="tipo">
              <option value="agua">💧 Agua</option>
              <option value="alimentos">🍞 Alimentos</option>
              <option value="parafarmacia">💊 Parafarmacia</option>
              <option value="ropa">👕 Ropa</option>
              <option value="higiene">🧴 Higiene</option>
              <option value="refugio">🏠 Refugio</option>
              <option value="transporte">🚗 Transporte</option>
              <option value="otros">📦 Otros</option>
            </select>

          <select id="select-prioridad" name="prioridad">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
            <option value="critica">Crítica</option>
          </select>

          <textarea
              id="textarea-desc"
              placeholder="Descripción detallada..."
          ></textarea>

          <div class="coords-group">
              <input
                type="number"
                step="any"
                id="input-lat"
                placeholder="Latitud"
                required
                readonly
              />
              <input
                type="number"
                step="any"
                id="input-lng"
                placeholder="Longitud"
                required
                readonly
              />
              <button type="button" id="btn-usar-gps">
                📍 Usar mi ubicación
              </button>
            </div>

            <button type="submit" class="btn-primario">
              Publicar Necesidad
            </button>
        </form>
      </section>
    </aside>

    <!-- MAPA INTERACTIVO -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Lógica de mapa y datos (usa import, necesita type="module") -->
    <script type="module" src="../js/core/mapa-necesidades/mapaNecesidades.js"></script>

    <!-- Conexión modular con tus Clases de Necesidades (E1) -->
    <script type="module">
      import { NeedFormController } from "../js/core/mapa-necesidades/formularioNecesidad.js";
      import { NeedCardComponent } from "../js/core/mapa-necesidades/necesidadCard.js";
      import { loadNeedsFromAPI } from "../js/core/mapa-necesidades/mapaNecesidades.js";
      import { actualizarEstadoNecesidad } from "../js/core/mapa-necesidades/necesidadesApi.js";

      const contenedorTarjetas = document.getElementById("contenedor-tarjetas");

      // 2 estados: abierta -> cubierta (sin en_proceso)
      async function cambiarEstado(id, estadoActual, siguienteEstado) {
        const necesidadActualizada = await actualizarEstadoNecesidad(id, siguienteEstado || "cubierta");

        // Refrescar el mapa por si el color del marcador depende del estado.
        await loadNeedsFromAPI();

        return necesidadActualizada;
      }

      // 1. Instanciar el controlador del formulario sobre el form existente.
      // nuevaNecesidad ya viene del backend (con id real y estado "abierta"),
      // así que no hay que inventarle ni id ni estado aquí.
      const needForm = new NeedFormController("#form-nueva-necesidad", async (nuevaNecesidad) => {
        // 2. Instanciar el componente Tarjeta (Objeto)
        const tarjetaComponente = new NeedCardComponent(nuevaNecesidad, cambiarEstado);

        // Insertar la tarjeta al inicio del panel lateral
        contenedorTarjetas.prepend(tarjetaComponente.getNode());
        needForm.reset();

        // 3. Refrescar el mapa para que aparezca el nuevo marcador
        await loadNeedsFromAPI();
      });
    </script>
  </body>
</html>
