name: CI

on:
  push:
    branches: [main, anexo-risk]
  pull_request:
    branches: [main, dev, anexo-risk]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        env:
          DATABASE_URL: sqlite:///./anexo_risk.db
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar imports de anexo_risk
        run: |
          python -c "from main import app; print('OK', app.title)"

      - name: Ejecutar tests
        env:
          DATABASE_URL: sqlite:///./anexo_risk.db
        run: |
          cd ..
          PYTHONPATH=backend python -m pytest tests/backend/ -v

  frontend-static-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar SPA entry point
        run: |
          test -f frontend/index.html
          test -f frontend/js/spa.js
          test -f frontend/manifest.json

      - name: Verificar que no hay referencias visibles a NEXO
        run: |
          ! grep -i "NEXO" frontend/index.html
          ! grep -i "NEXO" frontend/manifest.json
          echo "Identidad limpia: OK"
