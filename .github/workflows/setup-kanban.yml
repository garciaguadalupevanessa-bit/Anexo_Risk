name: Setup Kanban

# Crea el Kanban al mergear a main (GitHub Flow — main bloqueada, feat/* → main vía PR).
# Usa GITHUB_TOKEN (permiso de issues implicito en CI): no requiere autorizacion extra.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  kanban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear issues del Kanban
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash scripts/setup-kanban.sh
